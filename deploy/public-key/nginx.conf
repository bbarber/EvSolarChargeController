# Serves exactly one file: the application's public key, which Tesla fetches before it will pair a
# virtual key or accept a telemetry configuration.
#
# This has to be on the same host as fleet-telemetry. Tesla rejects a fleet_telemetry_config whose
# hostname is not under the domain the partner account is registered with, and a DuckDNS name
# carries a single A record — so one name serves the key on 443 and telemetry on 8443.

server {
    listen 443 ssl;
    http2 on;
    server_name evsolarchargecontroller.duckdns.org;

    ssl_certificate     /etc/nginx/certs/server-cert.pem;
    ssl_certificate_key /etc/nginx/certs/server-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Nothing else is exposed. This is a public endpoint on a box that also terminates vehicle
    # mTLS, so the smallest possible surface is the point.
    location = /.well-known/appspecific/com.tesla.3p.public-key.pem {
        default_type application/x-pem-file;
        root /srv;
        try_files /.well-known/appspecific/com.tesla.3p.public-key.pem =404;
    }

    location / {
        return 404;
    }
}
