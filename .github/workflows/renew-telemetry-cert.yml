name: Renew telemetry certificate

# fleet-telemetry serves its own TLS certificate, because Tesla's mutual-TLS handshake has to reach
# the process untouched — it identifies each vehicle from the client certificate on the TLS
# connection itself, so nothing may terminate TLS in front of it. That rules out every managed
# certificate service, and leaves us issuing and rotating a Let's Encrypt certificate here.
#
# DNS-01 rather than HTTP-01: nothing answers HTTP on the telemetry hostname (it is a raw TLS
# listener on port 8443), so proving control has to happen in DNS.

on:
  schedule:
    # Let's Encrypt certificates last 90 days. Weekly checks give plenty of retries before expiry,
    # and certbot no-ops until the certificate is within 30 days of expiring.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Renew even if the certificate is not near expiry
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: renew-telemetry-cert
  cancel-in-progress: false

jobs:
  renew:
    name: Issue and install
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          missing=()
          [[ -z "${{ vars.TELEMETRY_HOSTNAME }}" ]] && missing+=(TELEMETRY_HOSTNAME)
          [[ -z "${{ vars.ACME_EMAIL }}" ]] && missing+=(ACME_EMAIL)
          [[ -z "${{ secrets.DUCKDNS_TOKEN }}" ]] && missing+=(DUCKDNS_TOKEN)
          [[ -z "${{ secrets.TELEMETRY_SSH_KEY }}" ]] && missing+=(TELEMETRY_SSH_KEY)
          if (( ${#missing[@]} )); then
            echo "::error::Not configured yet. Missing: ${missing[*]}"
            exit 1
          fi

      - name: Install certbot and the DuckDNS plugin
        run: |
          python -m pip install --upgrade pip
          pip install certbot certbot-dns-duckdns

      - name: Issue certificate
        env:
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          TELEMETRY_HOSTNAME: ${{ vars.TELEMETRY_HOSTNAME }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
        run: |
          # DuckDNS holds only one TXT value per domain at a time, so a single hostname per
          # certificate — no wildcards, no SANs sharing the challenge record.
          certbot certonly \
            --non-interactive \
            --agree-tos \
            --email "$ACME_EMAIL" \
            --preferred-challenges dns \
            --authenticator dns-duckdns \
            --dns-duckdns-token "$DUCKDNS_TOKEN" \
            --dns-duckdns-propagation-seconds 60 \
            --config-dir ./letsencrypt \
            --work-dir ./letsencrypt-work \
            --logs-dir ./letsencrypt-logs \
            --cert-name telemetry \
            ${{ inputs.force && '--force-renewal' || '' }} \
            -d "$TELEMETRY_HOSTNAME"

      - name: Install on the telemetry host
        env:
          SSH_KEY: ${{ secrets.TELEMETRY_SSH_KEY }}
          SSH_HOST: ${{ vars.TELEMETRY_HOSTNAME }}
          SSH_USER: ${{ vars.TELEMETRY_SSH_USER || 'ubuntu' }}
          DEPLOY_DIR: ${{ vars.TELEMETRY_DEPLOY_DIR || '/opt/evsolar' }}
        run: |
          install -m 600 /dev/null key
          echo "$SSH_KEY" > key
          # Pinning the host key would mean rotating a secret every time the instance is rebuilt,
          # and the payload is a public certificate; the private key is the one thing that matters
          # and it is sent over the SSH channel itself.
          ssh_opts="-i key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"

          # File names must match the paths in fleet-telemetry's config.json.
          scp $ssh_opts ./letsencrypt/live/telemetry/fullchain.pem \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/fleet-telemetry/server-cert.pem"
          scp $ssh_opts ./letsencrypt/live/telemetry/privkey.pem \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/fleet-telemetry/server-key.pem"

          # The certificate is read at startup, so only a restart actually picks it up. Restarting
          # just the telemetry container leaves the controller running, so no solar readings or
          # telemetry state are lost.
          ssh $ssh_opts "$SSH_USER@$SSH_HOST" \
            "chmod 600 $DEPLOY_DIR/fleet-telemetry/server-key.pem && cd $DEPLOY_DIR && docker compose restart fleet-telemetry"

          rm -f key

      - name: Report expiry
        run: |
          expiry=$(openssl x509 -enddate -noout -in ./letsencrypt/live/telemetry/fullchain.pem | cut -d= -f2)
          {
            echo "### Telemetry certificate"
            echo
            echo "- Host: \`${{ vars.TELEMETRY_HOSTNAME }}\`"
            echo "- Valid until: $expiry"
          } >> "$GITHUB_STEP_SUMMARY"
