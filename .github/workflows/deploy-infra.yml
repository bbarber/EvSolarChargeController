name: Deploy infrastructure

on:
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: Resource group to deploy into
        required: true
        default: rg-evsolar-prod
      location:
        description: Azure region
        required: true
        default: centralus
      whatIf:
        description: Preview changes without applying them
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-infra
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.whatIf && 'What-if' || 'Deploy' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.whatIf && 'preview' || 'production' }}
    steps:
      - uses: actions/checkout@v4

      # Federated credentials — no client secret is stored in GitHub.
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        if: ${{ !inputs.whatIf }}
        run: |
          az group create \
            --name "${{ inputs.resourceGroup }}" \
            --location "${{ inputs.location }}" \
            --output none

      - name: What-if
        if: ${{ inputs.whatIf }}
        run: |
          az deployment group what-if \
            --resource-group "${{ inputs.resourceGroup }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters ingestSharedSecret="${{ secrets.INGEST_SHARED_SECRET }}" \
                         proxySharedSecret="${{ secrets.PROXY_SHARED_SECRET }}"

      - name: Deploy
        if: ${{ !inputs.whatIf }}
        id: deploy
        run: |
          az deployment group create \
            --resource-group "${{ inputs.resourceGroup }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters ingestSharedSecret="${{ secrets.INGEST_SHARED_SECRET }}" \
                         proxySharedSecret="${{ secrets.PROXY_SHARED_SECRET }}" \
            --query properties.outputs \
            --output json > outputs.json
          cat outputs.json

      - name: Summarize
        if: ${{ !inputs.whatIf }}
        run: |
          {
            echo "### Deployment outputs"
            echo
            echo '```json'
            cat outputs.json
            echo '```'
            echo
            echo "Secrets still need seeding: \`./tools/seed-keyvault.sh <key-vault-name>\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture function app name
        if: ${{ !inputs.whatIf }}
        id: outputs
        run: |
          name=$(python3 -c "import json;print(json.load(open('outputs.json'))['functionAppName']['value'])")
          echo "functionAppName=$name" >> "$GITHUB_OUTPUT"

      # Deploying the template replaces siteConfig.appSettings wholesale, which drops the
      # WEBSITE_RUN_FROM_PACKAGE pointer that zip deployment sets. Without this the app restarts
      # with zero functions loaded and no error anywhere obvious.
      - name: Set up .NET
        if: ${{ !inputs.whatIf }}
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Redeploy function code
        if: ${{ !inputs.whatIf }}
        run: |
          dotnet publish src/EvSolarChargeController.Functions/EvSolarChargeController.Functions.csproj \
            --configuration Release --output ./publish
          (cd publish && zip -qr ../app.zip .)
          az functionapp deployment source config-zip \
            --resource-group "${{ inputs.resourceGroup }}" \
            --name "${{ steps.outputs.outputs.functionAppName }}" \
            --src app.zip

      - name: Verify functions loaded
        if: ${{ !inputs.whatIf }}
        run: |
          app="${{ steps.outputs.outputs.functionAppName }}"
          az functionapp restart -g "${{ inputs.resourceGroup }}" -n "$app"

          # Consumption hosts do not load anything until something asks, so warm it before checking.
          key=$(az functionapp keys list -g "${{ inputs.resourceGroup }}" -n "$app" --query masterKey -o tsv)
          for _ in $(seq 1 20); do
            curl -sS -m 30 -o /dev/null "https://${app}.azurewebsites.net/admin/host/status?code=${key}" || true
            found=$(az functionapp function list -g "${{ inputs.resourceGroup }}" -n "$app" --query "length(@)" -o tsv 2>/dev/null || echo 0)
            if [[ "$found" -gt 0 ]]; then
              echo "$found function(s) loaded."
              az functionapp function list -g "${{ inputs.resourceGroup }}" -n "$app" --query "[].name" -o tsv
              exit 0
            fi
            sleep 15
          done
          echo "::error::No functions loaded after deployment."
          exit 1
