name: Build containers

on:
  push:
    branches: [main]
    paths:
      - 'src/EvSolarChargeController.TelemetryBridge/**'
      - 'tools/tesla-command-proxy/**'
      - '.github/workflows/build-containers.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-containers-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: telemetry-bridge
            dockerfile: src/EvSolarChargeController.TelemetryBridge/Dockerfile
          - image: tesla-command-proxy
            dockerfile: tools/tesla-command-proxy/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR is free for public images, which keeps the whole stack inside free tiers —
      # Azure Container Registry has no free SKU.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo
            echo "Set the matching Bicep parameter to one of:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
