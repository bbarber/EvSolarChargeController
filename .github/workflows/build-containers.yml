name: Build container

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'deploy/Dockerfile'
      - '.github/workflows/build-containers.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build evsolar
    # Native arm64, because the telemetry host is an Ampere A1 — the only Always Free shape the
    # tenancy's home region offers at all, since us-chicago-1 carries no E2 (x86) shapes.
    # Arm-hosted runners are free on public repositories and avoid QEMU, which matters most for the
    # cgo build: emulated, it is an order of magnitude slower than native.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR is free for public images, which keeps the whole stack inside free tiers.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/evsolar
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          # Only the architecture actually deployed. Add linux/amd64 here if a second target ever
          # appears; the Dockerfile is architecture-agnostic, so nothing else has to change.
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize
        run: |
          {
            echo "### evsolar (linux/arm64)"
            echo
            echo "Pull on the telemetry host, then \`docker compose up -d\`:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
