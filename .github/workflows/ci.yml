name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # Native arm64 to match the deployment target, and free on public repositories.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The ZeroMQ binding is cgo. Without these the telemetry package will not build.
      - name: Install libzmq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libzmq3-dev pkg-config

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [[ -n "$unformatted" ]]; then
            echo "::error::gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1

      - name: Build
        run: go build ./...

  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform -chdir=infra/oracle fmt -check -diff

      # No credentials needed: init -backend=false and validate check syntax and provider schemas
      # without touching the tenancy.
      - name: Validate
        run: |
          terraform -chdir=infra/oracle init -backend=false -input=false
          terraform -chdir=infra/oracle validate

  lint-shell:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck infra/oracle/launch-retry.sh tools/tesla-register-partner.sh
